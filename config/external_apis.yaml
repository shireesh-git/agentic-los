# External data providers.
#
# probe42: the company-data provider (MCA master, directors, charges, financials) over its MCP endpoint. The key
# goes in .env.local as PROBE42_API_KEY; without it the agents ask for the documents instead.

probe42:
  enabled: true
  transport: "mcp"
  mcp_url: "https://api-mcp.probe42.in/api/mcp"
  api_key_env: "PROBE42_API_KEY"
  api_version: "1.0"
  bundle_profile: "full"
  cache_enabled: true
  cache_ttl_hours: 0
