stages:
  - id: PS
    name: Prospect Sourcing
    # Client One stage 1 has no separate review: Prospect Submit goes straight to
    # IP Note Processing (the LPF VP review now sits in the IP stage, client stage 3).
    steps:
      - {id: ps_maker, name: Prospect Sourcing, role: ps_maker, kind: maker, sla_days: 5}
  - id: IP
    name: In-Principle
    steps:
      - {id: ip_note, name: IP Note Processing, role: ps_maker, kind: maker, sla_days: 3}
      - {id: ip_note_review, name: IP Note VP Review, role: lpf_vp, kind: checker, sla_days: 2}
      - {id: ip_crp_evp, name: CRP EVP Allocation, role: crp_evp, kind: allocation, sla_days: 1, allocates_to: crp_vp}
      - {id: ip_crp_vp, name: CRP VP Allocation, role: crp_vp, kind: allocation, sla_days: 1, allocates_to: risk_analyst}
      - {id: ip_risk_maker, name: Risk Maker (Credit Assessment), role: risk_analyst, kind: maker, sla_days: 7}
      - {id: ip_risk_review, name: CRP VP Risk Review, role: risk_reviewer, kind: checker, sla_days: 3}
      - {id: ip_evp, name: IP Note EVP Recommendation, role: evp_recommender, kind: checker, sla_days: 2}
      - {id: ip_sanction, name: IP Sanction Committee, role: sanction_committee, kind: committee, sla_days: 5}
  - id: AP
    name: Application Processing
    steps:
      - {id: ap_note, name: Application Note Processing, role: ps_maker, kind: maker, sla_days: 5}
      - {id: ap_review, name: LPF VP AP Review, role: lpf_vp, kind: checker, sla_days: 2}
      - {id: ap_crp_vp, name: CRP VP Allocation, role: crp_vp, kind: allocation, sla_days: 1, allocates_to: risk_analyst}
      - {id: ap_risk_maker, name: Risk Maker (Credit Reassessment), role: risk_analyst, kind: maker, sla_days: 5}
      - {id: ap_risk_review, name: Risk Review, role: risk_reviewer, kind: checker, sla_days: 3}
      - {id: ap_post_rating, name: Post Risk Rating Processing, role: post_risk_maker, kind: maker, sla_days: 2}
      - {id: ap_rating_vp, name: Post-Rating VP Review, role: crp_vp, kind: checker, sla_days: 1}
      - {id: ap_evp, name: EVP Recommendation, role: evp_recommender, kind: checker, sla_days: 2}
      - {id: ap_recommend, name: Recommendations Committee, role: recommendations_committee, kind: committee, sla_days: 2}
      - {id: ap_sanction, name: Committee Sanction, role: sanction_committee, kind: committee, sla_days: 5}
  - id: POS
    name: Post Sanction
    steps:
      - {id: pos_maker, name: Post Sanction Maker, role: pos_maker, kind: maker, sla_days: 5}
      - {id: pos_checker, name: Post Sanction Checker, role: pos_checker, kind: checker, sla_days: 2}
  - id: DIS
    name: Disbursement
    steps:
      - {id: dis_maker, name: Disbursement Maker, role: dis_maker, kind: maker, sla_days: 2}
      - {id: dis_checker, name: Disbursement Checker, role: dis_checker, kind: checker, sla_days: 1}
      - {id: dis_vp_review, name: Disbursement VP Review, role: dis_vp, kind: vp_review, sla_days: 1}
      - {id: dis_approver, name: Disbursement Approver, role: dis_approver, kind: checker, sla_days: 1}
