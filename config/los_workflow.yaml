stages:
  - id: PS
    name: Prospect Sourcing
    # Client One stage 1 has no separate review: Prospect Submit goes straight to
    # IP Note Processing (the LPF VP review now sits in the IP stage, client stage 3).
    steps:
      - {id: ps_maker, name: Prospect Sourcing, role: ps_maker, kind: maker, sla_days: 5, actions: [submit, defer, drop, withdraw], labels: {submit: Submit to IP Note}}
  - id: IP
    name: In-Principle
    steps:
      - {id: ip_note, name: IP Note Processing, role: ps_maker, kind: maker, sla_days: 3, actions: [submit, defer, drop], labels: {submit: Recommend IP proposal}}
      - {id: ip_note_review, name: IP Note VP Review, role: lpf_vp, kind: checker, sla_days: 2}
      - {id: ip_crp_evp, name: CRP EVP Allocation, role: crp_evp, kind: allocation, sla_days: 1, allocates_to: crp_vp}
      - {id: ip_crp_vp, name: CRP VP Allocation, role: crp_vp, kind: allocation, sla_days: 1, allocates_to: risk_analyst}
      - {id: ip_risk_maker, name: Risk Maker (Credit Assessment), role: risk_analyst, kind: maker, sla_days: 7}
      - {id: ip_risk_review, name: CRP VP Risk Review, role: risk_reviewer, kind: checker, sla_days: 3, labels: {return: Rework}}
      # G-W1: the IP flow's Post Rating VP Review
      - {id: ip_post_rating_vp, name: Post Rating VP Review, role: crp_vp, kind: checker, sla_days: 1, labels: {return: Rework}}
      - {id: ip_evp, name: IP Note EVP Recommendation, role: evp_recommender, kind: checker, sla_days: 2, decision_fields: [significant_changes], labels: {approve: Recommend for sanction}}
      - {id: ip_sanction, name: IP Sanction Committee, role: sanction_committee, kind: committee, sla_days: 5, labels: {sanction: Sanction (in-principle)}}
  - id: AP
    name: Application Processing
    steps:
      - {id: ap_note, name: Application Note Processing, role: ps_maker, kind: maker, sla_days: 5, actions: [submit, drop, withdraw], labels: {submit: Submit appraisal}, decision_fields: ap_record}
      - {id: ap_review, name: LPF VP AP Review, role: lpf_vp, kind: checker, sla_days: 2, labels: {return: Rework}, decision_fields: ap_record}
      - {id: ap_crp_vp, name: CRP VP Allocation, role: crp_vp, kind: allocation, sla_days: 1, allocates_to: risk_analyst}
      - {id: ap_risk_maker, name: Risk Maker (Credit Reassessment), role: risk_analyst, kind: maker, sla_days: 5, decision_fields: ap_record}
      - {id: ap_risk_review, name: Risk Review, role: risk_reviewer, kind: checker, sla_days: 3, labels: {return: Rework}, decision_fields: ap_record}
      - {id: ap_post_rating, name: Post Risk Rating Processing, role: post_risk_maker, kind: maker, sla_days: 2, decision_fields: ap_record}
      - {id: ap_rating_vp, name: Post-Rating VP Review, role: crp_vp, kind: checker, sla_days: 1, labels: {return: Rework}, decision_fields: ap_record}
      - {id: ap_evp, name: EVP Recommendation, role: evp_recommender, kind: checker, sla_days: 2, actions: [approve, return], decision_fields: [significant_changes], labels: {approve: Recommend for sanction, return: Rework}}
      - {id: ap_recommend, name: Recommendations Committee, role: recommendations_committee, kind: committee, sla_days: 2, actions: [sanction, return], decision_fields: [minutes, ceac_recommendation], labels: {sanction: Recommend for sanction, return: Rework}}
      # G-W2: the Environmental and Social (ESMS) process
      - {id: ap_es_maker, name: CRP ES Maker, role: es_maker, kind: maker, sla_days: 2, actions: [submit], returns_to: ap_post_rating, labels: {submit: Submit for ES preparation}}
      - {id: ap_es_prep, name: ES Preparation, role: es_preparer, kind: maker, sla_days: 3, actions: [submit], labels: {submit: Submit for ES review}}
      - {id: ap_es_review, name: ES Review, role: es_reviewer, kind: checker, sla_days: 2, actions: [approve, return], labels: {approve: Reviewed, return: Rework}}
      - {id: ap_es_recommend, name: ES Recommendation, role: es_recommender, kind: checker, sla_days: 2, actions: [approve, return], decision_fields: [{id: esms_recommendation, required: true}], labels: {approve: Recommend (ES), return: Rework}}
      # G-W3: DMD approval before the committee (enabled: false for the POS-manual order)
      - {id: ap_dmd, name: DMD Approval, role: dmd, kind: checker, sla_days: 2, actions: [approve, return], returns_to: ap_post_rating, labels: {approve: Approve for committee, return: Rework}}
      - {id: ap_sanction, name: Committee Sanction, role: sanction_committee, kind: committee, sla_days: 5, returns_to: ap_post_rating, labels: {sanction: Final sanction, return: Rework}}
  - id: POS
    name: Post Sanction
    steps:
      - {id: pos_maker, name: Post Sanction Maker, role: pos_maker, kind: maker, sla_days: 5, actions: [submit, propose_modification, withdraw], decision_fields: [significant_changes], labels: {withdraw: Application withdrawn, propose_modification: Modification proposed}}
      - {id: pos_checker, name: Post Sanction Checker, role: pos_checker, kind: checker, sla_days: 2, actions: [approve, recommend_modification, return, drop], labels: {approve: Recommend for disbursement, recommend_modification: Recommend for modification, return: Rework}}
  - id: DIS
    name: Disbursement
    steps:
      - {id: dis_maker, name: Disbursement Maker, role: dis_maker, kind: maker, sla_days: 2}
      - {id: dis_checker, name: Disbursement Checker, role: dis_checker, kind: checker, sla_days: 1, actions: [approve, return], labels: {approve: Submit to VP review, return: Rework}}
      - {id: dis_vp_review, name: Disbursement VP Review, role: dis_vp, kind: vp_review, sla_days: 1, decision_fields: [significant_changes]}
      - {id: dis_approver, name: Disbursement Approver, role: dis_approver, kind: checker, sla_days: 1, actions: [approve, return], labels: {approve: Approve disbursement, return: Rework}}