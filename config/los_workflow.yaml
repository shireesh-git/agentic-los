# Corporate LOS workflow — groups, roles, demo users, stages and steps.
#
# DEMO CONFIGURATION. Users are fictitious; sign-in is a demo picker (no passwords).
# Steps run in the order listed within a stage, and stages in the order listed.
#
# Step kinds:
#   maker       prepares the work and submits it (submit)
#   checker     reviews the maker's work (approve | return | reject)
#   vp_review   read-only VP approval gate: endorses or reworks (submit | return)
#   allocation  assigns the work to a person in the next role (allocate)
#   committee   decides (sanction | return | reject)
# sla_days: calendar days allowed in the step before it is flagged as an SLA breach.
# actions: the step's outcomes (default: the kind's); labels: the process wording for a button;
# decision_fields: recorded with the decision (required ones on submit / approve / sanction);
#   ap_record is the standard AP decision record (date of last material information, key matters for
#   the committee, proposal for confirmation / ratification, purpose of seeking approval, significant changes).
# returns_to: where a return goes by default (else the previous maker step in the stage).
# enabled: false switches a step off without deleting it.
#
# Step order is the process order. The bank's manuals differ on the end of AP: the AP manual has
# ES process -> DMD Approval -> Committee Sanction; the POS manual has ES stages -> Committee Sanction.
# The default below follows the AP manual; set ap_dmd to enabled: false for the POS-manual order
# (pending the bank's confirmation: docs/planning/REFERENCE_JOURNEY_GAP_ASSESSMENT.md section 2.2).

# Every decision records the acting user, step, time, outcome and remarks (process §3).
# 'all': remarks on every action except allocation; 'negative': only returns, drops, …
remarks_required: all

groups:
  - id: sourcing
    name: Sourcing & Relationship
    description: Initiate and manage prospect loan applications through the sourcing stages.
    roles: [ps_maker, lpf_vp]
  - id: credit
    name: Credit & Risk
    description: Credit appraisal, risk assessment, internal rating and allocation decisions.
    roles: [crp_evp, crp_vp, risk_analyst, risk_reviewer, post_risk_maker, compliance_vp,
            es_maker, es_preparer, es_reviewer, es_recommender]
  - id: committee
    name: Executive & Committee
    description: EVP-level recommendations and final sanction authority for large exposures.
    roles: [evp_recommender, recommendations_committee, dmd, sanction_committee]
  - id: operations
    name: Operations & Fulfilment
    description: Post-sanction documentation, verification and disbursement processing.
    roles: [pos_maker, pos_checker, dis_maker, dis_checker, dis_vp, dis_approver]
  - id: admin
    name: System Administration
    description: Users, groups, roles, audit logs and configuration.
    roles: [los_admin]

roles:
  ps_maker: Prospect Sourcing Maker (RM)
  lpf_vp: LPF VP
  crp_evp: CRP EVP
  crp_vp: CRP VP
  risk_analyst: Risk Analyst (Risk Maker)
  risk_reviewer: Risk Reviewer
  post_risk_maker: Post Risk Rating Maker
  compliance_vp: Compliance VP
  es_maker: CRP ES Maker
  es_preparer: ES Preparation (ESMS Analyst)
  es_reviewer: ES Reviewer
  es_recommender: ES Recommender
  dmd: Deputy Managing Director (DMD)
  evp_recommender: EVP Recommender
  recommendations_committee: Recommendations Committee
  sanction_committee: Sanction Committee
  pos_maker: Post Sanction Maker
  pos_checker: Post Sanction Checker
  dis_maker: Disbursement Maker
  dis_checker: Disbursement Checker
  dis_vp: Disbursement VP
  dis_approver: Disbursement Approver
  los_admin: LOS System Admin

