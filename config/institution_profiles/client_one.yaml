# ═══════════════════════════════════════════════════════════════════════
# Institution profile — CLIENT ONE (the bank the POC was built with)
#
# This profile reproduces the legacy hard-coded behaviour exactly: the full
# 5-stage / 31-step journey (config/los_workflow.yaml as written), every
# optional module on, the 15-check due-diligence catalogue with its base
# mandatory set, the base document checklists and the labelled demo
# authority matrix — under Client One's branding and wording.
#
# It is the default profile, so the application runs unchanged until
# another profile is selected (los.profile in settings.yaml, LOS_PROFILE,
# or POST /api/los/profiles/active).
# ═══════════════════════════════════════════════════════════════════════

profile:
  id: client_one
  name: "Client One"
  description: "Full corporate & project-finance journey — ES process, DMD approval and two committees."

branding:
  institution_name: "Demo Bank Ltd — Corporate Banking Group"
  short_name: "Demo Bank"
  app_name: "Corporate LOS"
  colors:
    primary: "#003366"
    accent: "#c9a227"
  paper:
    header: "Corporate Banking Group — Credit Sanctions"

labels:
  terms:
    bank: "the Bank"
    committee: "Credit Committee"
  decision_fields:
    material_information_date: "Date of receipt of last material information"
    committee_matters: "Any other matter to be highlighted to Committee"
    confirmation_ratification: "Proposal for confirmation / ratification"
    approval_purpose: "Purpose to seek approval"
    significant_changes: "Significant changes since the last review and material disclosures"
    minutes: "Minutes"
    ceac_recommendation: "CEAC recommendation"
    recommended_committee: "Recommended committee"
    esms_recommendation: "ES recommendation"

# The journey is exactly config/los_workflow.yaml as written; every optional
# module stays on, so no workflow or module overrides are needed.
workflow: {}
modules: {}

checks:
  exception_authority: {role: compliance_vp, name: "Compliance VP"}

# The base document checklists apply unchanged.
documents: {}

approval:
  currency: "₹ Cr"
  preliminary:
    - {max_amount: 200, authority: "IP Sanction Committee (preliminary)"}
    - {max_amount: 500, authority: "IP Sanction Committee (preliminary) with EVP note"}
    - {max_amount: null, authority: "IP Sanction Committee (preliminary) with EVP and CRP note"}
  final:
    - {max_amount: 200, authority: "Credit Sanction Committee"}
    - {max_amount: 500, authority: "Credit Sanction Committee with executive credit note"}
    - {max_amount: null, authority: "Credit Sanction Committee with executive credit note and board intimation"}
  sub_investment_grade_concurrence: true
  deviation_escalation_levels: 1

outputs:
  sanction_letter:
    kind_titles: {term_sheet: "Term sheet (indicative)", sanction_letter: "Sanction letter"}
    acceptance_days: 30
    demo_mark: "DEMO DOCUMENT generated by the LOS demonstration — not an offer, commitment or sanction of any bank."
  ip_note:
    title_prefix: "In-Principle Note"
  cam:
    title: "Credit Appraisal Memo"
  committee_pack:
    title: "Committee Pack"
