    steps:
      - {role: sanction_committee, stage: "Final Sanction Committee", action: "Review the case summary and committee record", expected: "Authority, open documents, deviations, conditions and structured decision controls are visible.", next: "Post-Sanction"}

  - id: corporate_post_sanction_showcase
    profile: corporate
