    story: "A fulfilled application opens at Disbursement Preparation with the complete downstream approval rail visible."
    steps:
      - {role: dis_maker, stage: "Disbursement Preparation", action: "Open the disbursement record and checklist", expected: "Drawdown, tranche, SOP, memo and downstream checker/head/approver stages are visible.", next: "Disbursement Verification"}
