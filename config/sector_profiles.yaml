infrastructure:
  industry_overview: India's infrastructure sector is witnessing unprecedented investment through the National Infrastructure
    Pipeline (NIP) worth ₹111 lakh Cr. The sector spans roads, railways, ports, urban infrastructure, and power.
    Government's capital expenditure push and PPP models are driving order book growth across EPC and construction
    companies.
  regulatory_environment: Regulated by NHAI, MoRTH, MoHUA, state PWDs, RERA, environmental clearances, and PPP concession
    agreements. SEBI InvIT regulations for infrastructure investment trusts.
  growth_drivers:
  - National Infrastructure Pipeline (NIP) — ₹111 lakh Cr investment
  - PM Gati Shakti National Master Plan for multimodal connectivity
  - Dedicated freight corridors and high-speed rail initiatives
  - Smart Cities Mission and AMRUT urban infrastructure
  headwinds:
  - Land acquisition delays and regulatory approvals
  - Rising material costs (steel, cement, bitumen)
  - Project execution risks and cost overruns
  - Seasonal impact of monsoon on construction activity
