logistics:
  industry_overview: India's logistics sector is valued at approximately $200 billion and contributes ~14% of GDP.
    The sector is undergoing transformation through the National Logistics Policy (NLP) targeting cost reduction
    from ~14% to ~8% of GDP. Multimodal integration, warehouse aggregation, and technology adoption are reshaping
    the competitive landscape.
  regulatory_environment: Motor Vehicles Act, MoRTH regulations, GST e-way bill requirements, Customs Act for international
    freight, DGCA for air cargo, Shipping Ministry for maritime.
  growth_drivers:
  - National Logistics Policy driving cost reduction and efficiency
  - E-commerce growth fuelling warehousing and last-mile demand
  - Dedicated Freight Corridors reducing transit times
  - GST unification enabling hub-and-spoke distribution models
  headwinds:
  - Fuel price volatility impacting operating margins
  - Fragmented and unorganized competition in road transport
  - Infrastructure gaps in cold chain and specialized logistics
  - Driver shortage and high attrition in workforce
