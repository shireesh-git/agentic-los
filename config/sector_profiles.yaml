pharma:
  industry_overview: India is the 'pharmacy of the world', being the largest producer of generic medicines globally,
    supplying over 20% of the world's generic drug demand. The domestic pharma market is valued at ~₹2 lakh Cr and
    growing at 8-10% CAGR. Contract manufacturing (CDMO) and biosimilars present significant growth opportunities.
  regulatory_environment: Regulated by CDSCO/DCGI, Drug Price Control Order (DPCO/NPPA), USFDA, EMA for exports.
    WHO-GMP and Schedule M compliance mandatory for manufacturing.
  growth_drivers:
  - Patent cliff in global markets opens generic opportunities
  - Growing CDMO/CMO segment with China+1 tailwinds
  - Ayushman Bharat and expanding healthcare access
  - Biosimilar development pipeline
  headwinds:
  - USFDA regulatory scrutiny and warning letters
  - Drug price controls under DPCO impacting margins
  - R&D costs and clinical trial uncertainties
  - API import dependency on China (~68%)
