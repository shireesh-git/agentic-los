    pct: 12.0
  - region: East & Northeast India
    pct: 8.0
hospitality:
  industry_overview: India's hospitality and tourism sector contributes ~5% to GDP and is a major employment generator
    (8% of total employment). The sector is recovering strongly post-pandemic with RevPAR surpassing pre-COVID levels.
    Domestic tourism (~1.8 billion trips/year) and rising inbound tourism (10.9 million visitors in FY2024) are
    driving robust demand. Branded hotel supply is expanding with ~180,000 rooms in pipeline across luxury, upper-upscale,
    and midscale.
  regulatory_environment: Regulated by Ministry of Tourism (classification/ratings), FSSAI (food safety), state
    excise departments (liquor), BIS standards, fire safety codes, environmental clearances, and RERA for hotel
    real estate. Classification under Hotel Classification Committee.
  growth_drivers:
  - Post-pandemic revenge travel and rising domestic tourism spend
  - Government's 'Incredible India' campaign and e-visa on arrival for 170+ countries
  - Rising MICE (Meetings, Incentives, Conferences, Exhibitions) segment
  - Branded hotel penetration at only ~55% vs. 70%+ in developed markets
  headwinds:
  - Cyclicality tied to global economic conditions and travel sentiment
  - High fixed costs (staff, property maintenance) impacting margins in downturns
  - Rising OTA (Online Travel Aggregator) commission costs averaging 15-20%
  - Regulatory complexity across states for excise/tourism licenses
