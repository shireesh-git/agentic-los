<!-- Application detail: header, stage rail, current step with its actions, details and the audit trail -->
<section x-show="page === 'app'">
  <p class="empty-state card" x-show="!current">Loading the application…</p>
  <template x-if="current">
  <div>
    <div class="los-app-head">
      <button class="btn btn-sm btn-ghost" @click="go(lastList)">← Back</button>
      <div class="los-app-title">
        <strong x-text="current?.application_id"></strong>
        <span x-text="current?.borrower_name"></span>
        <span class="badge sm" :class="statusCls(current?.status)" x-text="statusLabel(current?.status)"></span>
        <span class="badge sm badge-red" x-show="current?.escalated">Escalated</span>
        <span class="badge sm badge-grey" x-show="current?.seeded_demo" title="Seeded demo application">Demo</span>
      </div>
      <div class="los-app-actions">
        <a class="btn btn-sm btn-outline" x-show="current?.credit_assessment" :href="'/#case/' + current?.entity_id" target="_blank" rel="noopener"
           title="The CAM and the credit analysis for this borrower, in the CAM workspace">CAM ↗</a>
        <span class="btn btn-sm btn-outline" x-show="!current?.credit_assessment" style="opacity:.55;cursor:help"
              title="The CAM is generated by the agents at the IP Note step (or at Prospect Sourcing with Generate CAM). It opens here once it exists.">CAM — not generated yet</span>
        <button class="btn btn-sm btn-outline" x-show="current?.can_reassign" @click="openPanel('reassign')">Reassign</button>
        <button class="btn btn-sm btn-outline" x-show="current?.step && current?.status !== 'REJECTED'" @click="openPanel('escalate')">Escalate</button>
      </div>
    </div>

    <div class="los-app-body">
      <!-- Stage rail -->
      <aside class="los-rail">
        <div class="los-rail-facility">
          <strong x-text="titleCase(current?.facility?.facility_type)"></strong>
          <span x-text="'₹' + fmtAmount(current?.amount_cr) + ' Cr'"></span>
        </div>
        <template x-for="st in current?.rail || []" :key="st.id">
          <div class="los-rail-stage" :class="'los-' + st.state">
            <button type="button" class="los-rail-stage-head" @click="toggleStage(st.id)">
              <span class="los-rail-code" x-text="st.id"></span><span x-text="st.name"></span>
              <span class="los-rail-caret" x-text="openStages[st.id] ? '▾' : '▸'"></span>
            </button>
            <ol x-show="openStages[st.id]">
              <template x-for="s in st.steps" :key="s.id">
                <li :class="'los-' + s.state" :title="s.role_name"><span class="los-dot"></span><span x-text="s.name"></span></li>
              </template>
            </ol>
          </div>
        </template>
      </aside>

      <div class="los-app-main">
        <!-- The last error stays visible until dismissed (or the next successful action) -->
        <div class="los-error-banner" x-show="lastError" role="alert">
          <strong>Could not complete that:</strong> <span x-text="lastError"></span>
          <button class="btn btn-sm btn-ghost" @click="lastError = ''" aria-label="Dismiss">✕</button>
        </div>
        <!-- Page sections: one at a time, so the page shows only what the person is working on -->
        <!-- the copilot, one click away on every tab -->
        <button class="los-cop-fab" x-show="copilot && !copilotOpen" @click="copilotOpen = true" title="Copilot: next best actions, drafts and questions">
          <span>Copilot</span>
          <span class="los-cop-fab-n" x-show="(copilot?.actions || []).length" x-text="(copilot?.actions || []).length"></span>
        </button>
        <!-- Copilot: next best actions (runs tools for the step holder), drafts and Q&A on this application -->
        <div class="card los-copilot los-cop-drawer" x-show="copilot && copilotOpen" x-transition.opacity @keydown.escape.window="copilotOpen = false">
          <div class="los-rm-head">
            <div>
              <span class="los-kicker">Copilot · agentic assistant</span>
              <h3>Next best actions</h3>
              <span class="text-muted">Proposals from the application's state. The copilot can run the marked tasks for you;
                it never submits, approves, returns or sanctions.</span>
            </div>
            <div class="los-action-row">
              <span class="badge sm" :class="copilot?.ai_available ? 'badge-green' : 'badge-grey'"
                    x-text="copilot?.ai_available ? 'AI connected' : 'Rule-based'"></span>
              <button class="btn btn-sm btn-ghost" @click="copilotOpen = false" aria-label="Close the copilot">✕</button>
            </div>
          </div>
          <!-- what the last task did: resolved, partly, or not -->
          <div class="los-cop-result" x-show="copilotResult" :class="'los-cop-' + copilotResult?.outcome">
            <strong x-text="copilotResult?.message"></strong>
            <div x-show="copilotResult?.detail" x-text="copilotResult?.detail"></div>
            <template x-for="(r, ri) in copilotResult?.resolved || []" :key="'r' + ri"><div>✓ Resolved: <span x-text="r"></span></div></template>
            <template x-for="(r, ri) in copilotResult?.changed || []" :key="'c' + ri"><div>↻ Changed: <span x-text="r"></span></div></template>
            <div x-show="(copilotResult?.still_open || []).length" style="margin-top:4px"><strong>Still to do:</strong></div>
            <template x-for="(r, ri) in copilotResult?.still_open || []" :key="'o' + ri"><div>• <span x-text="splitMsg(r).head"></span></div></template>
          </div>
          <ol class="los-cop-list">
            <template x-for="a in copilot?.actions || []" :key="a.id">
              <li :class="'los-cop-' + a.priority">
                <div class="los-cop-text"><strong x-text="a.title"></strong><span class="text-muted" x-text="a.why"></span></div>
                <div class="los-action-row">
                  <button class="btn btn-sm btn-primary" x-show="a.tool && copilot?.is_holder" :disabled="!!copilotBusy"
                          @click="copilotRun(a.tool)" x-text="copilotBusy === a.tool ? 'Working…' : 'Do it'"></button>
                  <button class="btn btn-sm btn-outline" x-show="['dd_exception', 'dd_waiting', 'exception_decision'].includes(a.id)"
                          @click="copilotOpen = false; goTo('checks')">Go to Checks</button>
                  <button class="btn btn-sm btn-outline" x-show="a.draft" :disabled="!!copilotBusy"
                          @click="copilotDraft(a.draft)" x-text="a.draft === 'return_note' ? 'Draft return note' : 'Draft request'"></button>
                </div>
              </li>
            </template>
          </ol>
          <template x-if="draft">
          <div class="los-cop-draft">
            <div class="los-rm-head"><strong x-text="draft?.kind === 'return_note' ? 'Draft return note' : 'Draft document request'"></strong>
              <div class="los-action-row">
                <button class="btn btn-sm btn-outline" x-show="draft?.kind === 'return_note' && current?.actions?.includes('return')" @click="comment = draft.text; notify('Draft copied into the comment box — edit, then Return', 'ok')">Use as comment</button>
                <button class="btn btn-sm btn-outline" @click="copyDraft()">Copy</button>
                <button class="btn btn-sm btn-outline" @click="draft = null">Close</button>
              </div></div>
            <textarea class="input" rows="7" x-model="draft.text" aria-label="Draft text"></textarea>
            <p class="text-muted los-note" x-text="draft?.note"></p>
          </div>
          </template>
          <div class="los-cop-ask">
            <form class="los-cop-askrow" @submit.prevent="copilotAsk()">
              <input class="input" x-model="question" maxlength="500" placeholder="Ask about this application — e.g. Why was the limit reduced? What conditions are open?" aria-label="Ask the copilot">
              <button class="btn btn-primary" :disabled="asking || !question.trim()" x-text="asking ? 'Thinking…' : 'Ask'"></button>
            </form>
            <template x-for="(h, i) in copilot?.history || []" :key="i">
              <div class="los-cop-qa">
                <div class="los-cop-q"><span x-text="h.question"></span> <span class="text-muted los-small" x-text="h.by_name + ' · ' + fmtDateTime(h.at)"></span></div>
                <div class="los-cop-a"><span class="prov" :class="h.mode === 'ai' ? 'prov-ai' : 'prov-source'" x-text="h.mode === 'ai' ? 'AI' : 'Record'"></span>
                  <span class="los-pre" x-text="h.answer"></span></div>
                <div class="text-muted los-small" x-show="h.note" x-text="h.note"></div>
              </div>
            </template>
          </div>
        </div>

        <nav class="los-page-tabs">
          <template x-for="t in pageTabs()" :key="t[0]">
            <button type="button" :class="{active: pageTab === t[0]}"
                    @click="pageTab = t[0]; if (t[0] === 'workspaces') openGov(gov.tab); if (t[0] === 'decision') loadDecision()">
              <span x-text="t[1]"></span>
              <span class="los-tab-issue" x-show="tabIssues(t[0])" x-text="tabIssues(t[0])"></span>
            </button>
          </template>
        </nav>
        <div x-show="pageTab === 'task'">
        <!-- Current step -->
        <div class="card los-step-card" x-show="current?.step">
          <div class="los-step-head">
            <div>
              <span class="los-kicker" x-text="current?.step?.stage_name"></span>
              <h2 x-text="current?.step?.name"></h2>
              <span class="text-muted" x-text="current?.step?.role_name + ' · ' + kindLabel(current?.step?.kind)"></span>
            </div>
            <div class="los-step-meta">
              <div><span>Assignee</span><strong x-text="current?.assignee_name || 'Unassigned'"></strong></div>
              <div><span>SLA</span><strong class="los-sla" :class="slaCls(current?.sla)" x-text="slaText(current?.sla)"></strong></div>
              <div><span>Turnaround</span><strong x-text="current?.tat_days + ' days'"></strong></div>
            </div>
          </div>

          <div class="status-inline status-inline-error" x-show="current?.status === 'RETURNED'">
            <span x-text="'Returned for rework: ' + (lastReturn()?.comment || '')"></span>
          </div>
          <p class="text-muted los-step-note" x-show="current?.demo_note" x-text="current?.demo_note"></p>

          <div x-show="current?.actions?.length">
            <label class="los-field" x-show="current?.step?.kind === 'allocation'">Allocate to
              <select class="input" x-model="allocateTo">
                <option value="">Select…</option>
                <template x-for="u in usersWithRole(current?.step?.allocates_to)" :key="u.id"><option :value="u.id" x-text="u.name"></option></template>
              </select>
            </label>
            <!-- What to do now: the blockers of Submit / Approve (the server's own gates) and the agents' work waiting -->
            <div class="los-todo" x-show="todo().length || forwardAction()">
              <div class="los-todo-head" :class="blockingCount() ? 'los-todo-blocked' : 'los-todo-ready'">
                <strong x-text="blockingCount()
                  ? ((blockingCount() === 1 ? '1 thing' : blockingCount() + ' things') + ' to finish before “' + (actionLabelFor(forwardAction()) || forwardAction()) + '”')
                  : 'Ready — nothing blocks “' + (actionLabelFor(forwardAction()) || 'proceed') + '”'"></strong>
              </div>
              <ul x-show="todo().length">
                <template x-for="(t, i) in todo()" :key="i">
                  <li :class="t.blocking ? 'los-todo-block' : 'los-todo-advice'">
                    <span class="los-todo-icon" x-text="t.blocking ? '!' : 'i'"></span>
                    <span class="los-todo-text">
                      <span x-text="splitMsg(t.text).head"></span>
                      <details x-show="splitMsg(t.text).items.length" class="los-small">
                        <summary x-text="'Show the ' + splitMsg(t.text).items.length + ' items'"></summary>
                        <ul class="los-todo-sub"><template x-for="(it, ii) in splitMsg(t.text).items" :key="ii"><li x-text="it"></li></template></ul>
                      </details>
                    </span>
                    <button class="btn btn-sm btn-outline" x-show="t.where !== 'task' || pageTab !== 'task'" @click="goTo(t.where)"
                            x-text="'Go to ' + whereLabel(t.where)"></button>
                    <button class="btn btn-sm btn-outline" x-show="t.where === 'task' && pageTab === 'task' && (t.target || workCard())" @click="showWork(t.target)">Show me</button>
                  </li>
                </template>
              </ul>
            </div>
            <div class="status-inline" x-show="current?.step?.id === 'dis_vp_review' && ps">
              <span x-text="'Read-only VP review of the disbursement record' + (ps?.disbursement?.pending_tranche ? ' — verified tranche ₹' + fmtAmount(ps.disbursement.pending_tranche.amount_cr) + ' Cr, value ' + ps.disbursement.pending_tranche.value_date : '')
                + '. Submit to endorse it to the Disbursement Approver, or Rework to return it to the Disbursement Maker (a comment is required).'"></span>
            </div>
            <label class="los-field" x-show="current?.actions?.includes('sanction')">Sanctioned amount (₹ Cr)
              <input class="input" type="number" min="0" step="0.01" x-model.number="sanctionAmount">
              <span class="text-muted" x-text="'Reassessed recommendation: ' + (pack?.recommended_sanction_label || '—') + '. For a different amount, give the reason in the comment — it is recorded as the minutes.'"></span>
            </label>
            <label class="los-field" x-show="current?.actions?.includes('return') && (current?.rework_destinations?.length)">Rework destination <span class="text-muted">(optional — a specific earlier step; the reason goes in the comment)</span>
              <select class="input" x-model="reworkTo">
                <option value="">Default (the stage's maker step)</option>
                <template x-for="d in current?.rework_destinations || []" :key="d.id"><option :value="d.id" x-text="d.name + ' — ' + d.stage"></option></template>
              </select>
            </label>
            <div class="status-inline" x-show="current?.status === 'DEFERRED'">
              <span x-text="'Deferred until ' + (current?.deferral?.until || '—') + ' by ' + (current?.deferral?.by_name || '—') + ': ' + (current?.deferral?.reason || '') + '. The SLA is paused; reactivate to take it up again.'"></span>
            </div>
            <!-- The step's decision record (configured per step in los_workflow.yaml) -->
            <template x-for="f in current?.decision_fields || []" :key="f.id">
              <label class="los-field" :id="'df-' + f.id"><span x-text="(f.label || titleCase(f.id.replaceAll('_', ' '))) + (f.required ? ' *' : '')"></span>
                <input class="input" :type="f.type === 'date' ? 'date' : 'text'" :value="decisionData[f.id] || ''"
                       @input="decisionData = {...decisionData, [f.id]: $event.target.value}">
                <span class="text-muted los-small" x-show="current?.decision_defaults?.[f.id] && decisionData[f.id] === current?.decision_defaults?.[f.id]">
                  Carried forward from the previous step — confirm or change</span>
              </label>
            </template>
            <label class="los-field" x-show="current?.actions?.includes('defer') && deferOpen">Defer until <span class="text-muted">(needed to defer — the date to take it up again)</span>
              <input class="input" type="date" x-model="deferUntil">
            </label>
            <label class="los-field">Comment <span class="text-muted" x-text="current?.remarks_required === 'all' ? '(required — every decision records its remarks)'
              : current?.actions?.includes('sanction') ? '(sanction minutes; required to return, reject or sanction a different amount)'
              : current?.step?.id === 'pos_checker' ? '(required for every decision at this step)' : '(required to return, reject, withdraw, drop or propose a modification)'"></span>
              <textarea class="input" rows="2" x-model="comment" placeholder="Notes for the next person and the audit trail"></textarea>
            </label>
            <div class="los-action-row">
              <template x-for="a in current?.actions || []" :key="a">
                <button class="btn" :class="actionCls(a)" :disabled="busy || actionBlocked(a)" @click="act(a)" x-text="actionLabelFor(a)"
                        :title="actionBlocked(a) ? 'Finish the items listed above first' : ''"></button>
              </template>
            </div>
          </div>
          <div class="los-warn" x-show="current?.assigned_to_other" style="display:flex;align-items:center;gap:10px">
            <span x-text="'This step is assigned to ' + (current?.assignee_name || 'someone else') + '. Assign it to yourself to work on it.'"></span>
            <button class="btn btn-sm btn-primary" x-show="current?.can_reassign" :disabled="busy" @click="reassignTo = session.user.id; reassign()">Assign to me</button>
          </div>
          <p class="text-muted" x-show="!current?.actions?.length && !(session?.role === 'compliance_vp' && (current?.exception_requests || []).length) && !current?.assigned_to_other && current?.status !== 'REJECTED' && !['WITHDRAWN','DROPPED'].includes(current?.status)"
             x-text="'This step is with the ' + current?.step?.role_name + ' role' + (current?.assignee_name ? ' (' + current?.assignee_name + ')' : '') + '. Switch role or sign in as that user to act on it.'"></p>
          <p class="status-inline status-inline-error" x-show="current?.status === 'REJECTED'">This application was rejected.</p>
          <p class="status-inline status-inline-error" x-show="current?.status === 'WITHDRAWN'"
             x-text="'Application withdrawn — ' + (current?.terminated?.reason || 'no reason recorded') + ' (' + (current?.terminated?.by_name || '') + ')'"></p>
          <p class="status-inline status-inline-error" x-show="current?.status === 'DROPPED'"
             x-text="'Application dropped / terminated — ' + (current?.terminated?.reason || 'no reason recorded') + ' (' + (current?.terminated?.by_name || '') + ')'"></p>

          <div class="los-panel" id="los-panel-reassign" x-show="panel === 'reassign'">
            <label class="los-field">Reassign to
              <select class="input" x-model="reassignTo">
                <option value="">Select…</option>
                <template x-for="u in usersWithRole(current?.step?.role)" :key="u.id"><option :value="u.id" x-text="u.name"></option></template>
              </select>
            </label>
            <button class="btn btn-sm btn-primary" :disabled="!reassignTo || busy" @click="reassign()">Reassign</button>
          </div>
          <div class="los-panel" id="los-panel-escalate" x-show="panel === 'escalate'">
            <label class="los-field">Reason for escalation<textarea class="input" rows="2" x-model="escalateNote"></textarea></label>
            <button class="btn btn-sm btn-primary" :disabled="!escalateNote.trim() || busy" @click="escalate()">Escalate</button>
          </div>
        </div>
        <div class="card status-inline-success los-complete-card" x-show="current && !current.step">
          <strong>Complete.</strong> All stages are done — the application has reached Exit (approved).
          Payment execution and reconciliation with core banking are outside the LOS.
          <div class="los-panel" x-show="current?.status === 'APPROVED'" style="margin-top:8px">
            <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:end">
              <label class="los-field">Subsequent tranche — reason (required)
                <input x-model="subTrancheReason" placeholder="e.g. project milestone reached; drawdown for phase 2"></label>
              <button class="btn btn-sm btn-primary" :disabled="busy || !subTrancheReason.trim()" @click="requestSubsequentTranche()">Request subsequent tranche</button>
              <span class="text-muted los-small" x-show="current.tranche_rounds > 1" x-text="'Tranche round ' + current.tranche_rounds + ' (repeat drawdown after Exit)'"></span>
            </div>
            <p class="text-muted los-small" style="margin:6px 0 0">Re-opens the application at the Disbursement Maker; the usual DIS gates apply to the new tranche.</p>
          </div>
        </div>

        <!-- Dependency invalidations (UAT-P2-10): ownership / group / rating changes awaiting re-evaluation -->
        <div class="card" x-show="current && (current.open_invalidations || []).length">
          <div class="summary-table-head">
            <h3>Stale conclusions — re-evaluation required</h3>
            <span class="text-muted">An ownership, group or rating change has made a prior conclusion stale. Resolve it once the re-evaluation is done.</span>
          </div>
          <template x-for="inv in current.open_invalidations" :key="inv.invalidation_id">
            <div class="status-inline status-inline-error" style="margin:6px 0">
              <span class="badge sm badge-red" x-text="inv.type"></span>
              <span x-text="inv.detail + ' (by ' + inv.by_name + ', ' + inv.at + ')'"></span>
              <div style="display:flex;gap:8px;margin-top:6px" x-show="invResolving === inv.invalidation_id">
                <input class="input" x-model="invResolution" placeholder="Resolution note — what was re-evaluated (required)">
                <button class="btn btn-sm btn-primary" :disabled="busy || !invResolution.trim()" @click="resolveInvalidation(inv.invalidation_id)">Resolve</button>
                <button class="btn btn-sm btn-ghost" @click="invResolving = ''">Cancel</button>
              </div>
              <button class="btn btn-sm btn-outline" style="margin-top:6px" x-show="invResolving !== inv.invalidation_id" @click="invResolving = inv.invalidation_id; invResolution = ''">Resolve…</button>
            </div>
          </template>
        </div>

        <!-- Agents & verification for the current step: the preparation agent and what its agents populated
             that this step verifies (by exception). -->
        <div class="card los-verify-card" x-show="rm && (current?.actions || []).length && (rm.can_prepare || rm.verify?.step_stats?.total || (rm.prep?.lanes || []).length)">
          <div class="los-rm-head">
            <div>
              <span class="los-kicker">Agents · verify by exception</span>
              <h3>Prepared by agents, verified by you</h3>
              <span class="text-muted" x-text="stepPrepHeadline()"></span>
              <div class="los-small" style="margin-top:4px" x-show="current?.prefill_coverage && ['ip_note','ap_note'].includes(current?.step?.id)">
                <strong x-text="'Note sections pre-filled: ' + current?.prefill_coverage?.filled + ' of ' + current?.prefill_coverage?.total"></strong>
                <span class="text-muted" x-show="(current?.prefill_coverage?.sections || []).some(x => x.applicable && !x.filled)"
                      x-text="' · still to complete: ' + (current?.prefill_coverage?.sections || []).filter(x => x.applicable && !x.filled).map(x => x.label).join(', ')"></span>
              </div>
            </div>
            <div class="los-action-row">
              <button class="btn btn-primary" x-show="rm?.can_prepare" :disabled="rmPrepRunning()" @click="prepareStep()"
                      x-text="rmPrepRunning() ? 'Agents preparing…' : 'Prepare with agents'"
                      title="Credit case, API checks, and the reconciliation agents per workspace, in parallel"></button>
            </div>
          </div>
          <div class="los-agent-lanes" x-show="(rm?.prep?.lanes || []).length">
            <template x-for="lane in (rm?.prep?.lanes || [])" :key="lane.lane">
              <span class="badge" :class="{running: 'badge-amber', completed: 'badge-green', failed: 'badge-red'}[lane.status] || 'badge-grey'"
                    :title="lane.description" x-text="titleCase(lane.lane.replaceAll('_', ' ')) + (lane.status === 'running' ? ' …' : '')"></span>
            </template>
          </div>
          <div class="status-inline status-inline-error" x-show="rm?.prep?.state === 'failed'"><span x-text="'Preparation failed: ' + (rm?.prep?.error || '')"></span></div>
          <template x-for="(w, i) in (rm?.prep?.summary?.warnings || [])" :key="i"><div class="los-warn" x-text="w"></div></template>
          <!-- Populate → Verify: fields the agents populated, shown by exception (conflicts, decision-driving,
               critic issues, low confidence first); high-confidence proposals arrive pre-ticked. -->
          <div class="los-verify" x-show="rm?.verify?.step_stats?.total">
            <div class="los-verify-head">
              <span class="los-kicker">Auto-populated · verify by exception</span>
              <span x-text="verifyStatsText()"></span>
            </div>
            <div class="status-inline" x-show="rm?.pin?.newer_run_available">
              <span>A newer credit run exists for this borrower; this application stays on the run it was assessed with
                (<span x-text="rm?.pin?.shown_run_id"></span>). Re-run the assessment to move to new data.</span>
            </div>
            <div class="los-panel" x-show="current?.step?.id === 'ps_maker' && (rm?.verify?.queue || []).length">
              <span x-text="(rm?.verify?.queue || []).length + ' value(s) read from the documents are waiting for you.'"></span>
              Review, accept or correct them in <strong>Documents &amp; AI prefill</strong> below — each with its source page.
              <button class="btn btn-sm btn-outline" style="margin-left:8px" @click="showWork()">Open Documents &amp; AI prefill</button>
            </div>
            <template x-if="rm?.can_verify && (rm?.verify?.queue || []).length && current?.step?.id !== 'ps_maker'">
              <div>
                <div class="los-action-row">
                  <button class="btn btn-primary btn-sm" :disabled="busy || !verifySelected().length" @click="confirmSelected()"

        <div class="card los-letters" x-show="(letters?.letters || []).some(l => l.available || l.versions.length)">
          <div class="los-rm-head">
            <div>
              <span class="los-kicker">Documents</span>
              <h3>Term sheet &amp; sanction letter</h3>
              <span class="text-muted">Generated from the sanction record, conditions, covenants and approved deviations. Each issue is a new, immutable version.</span>
            </div>
          </div>
          <div class="los-pack-grid">
            <template x-for="l in letters?.letters || []" :key="l.kind">
              <div class="los-pack-block">
                <h4><span x-text="l.title"></span>
                  <span class="badge sm" :class="l.versions.length ? 'badge-green' : (l.available ? 'badge-amber' : 'badge-grey')"
                        x-text="l.versions.length ? 'Issued v' + l.versions[0].version : (l.available ? 'Not issued' : 'Not available')"></span></h4>
                <p class="text-muted" x-show="!l.available" x-text="l.reason"></p>
                <p class="text-muted" x-show="l.available && !l.can_generate && !l.versions.length" x-text="'Issued by the ' + l.issuer_role + ' role.'"></p>
                <div x-show="l.versions.length">
                  <div class="los-small" x-text="l.versions[0]?.reference + ' · ' + fmtDateTime(l.versions[0]?.issued_at) + ' · ' + l.versions[0]?.issued_by"></div>
                  <div class="los-small text-muted" x-text="'Valid for acceptance until ' + l.versions[0]?.valid_until"></div>
                </div>
                <div class="los-action-row">
                  <button class="btn btn-sm btn-primary" x-show="l.can_generate" :disabled="busy" @click="issueLetter(l.kind)"
                          x-text="l.versions.length ? 'Re-issue' : 'Issue'"></button>
                  <button class="btn btn-sm btn-outline" x-show="l.versions.length" @click="openLetter(l.kind)">Open ↗</button>
                </div>
                <details x-show="l.versions.length > 1"><summary class="los-small" x-text="(l.versions.length - 1) + ' earlier version(s)'"></summary>
                  <ul class="los-rm-lines"><template x-for="v in l.versions.slice(1)" :key="v.version">
                    <li><a href="#" @click.prevent="openLetter(l.kind, v.version)" x-text="v.reference"></a>
                      <span class="text-muted" x-text="' · ' + fmtDateTime(v.issued_at) + ' · ' + v.issued_by"></span></li>
                  </template></ul></details>
              </div>
            </template>
          </div>
        </div>

        <!-- Post sanction & disbursement: conditions, deviations, IP → AP, tranche -->
        <template x-if="ps?.visible">
        <div class="card los-post">
          <div class="los-rm-head">
            <div>
              <span class="los-kicker">Post sanction &amp; disbursement</span>
              <h3>Conditions, deviations and disbursement</h3>
              <span class="text-muted" x-text="postHeadline()"></span>
            </div>
          </div>

          <!-- Sanction consent & facility execution (Client One GAP-P0-13) -->
          <div x-show="ps?.at_post_sanction" style="margin-bottom:14px;">
            <template x-if="ps?.consent">
              <div class="status-inline status-inline-success">
                <strong>Sanction consent recorded.</strong>
                <span x-text="'Acknowledged by ' + ps.consent.acknowledged_by + ' on ' + ps.consent.consent_date + ' (recorded by ' + ps.consent.by_name + ', ' + ps.consent.at + ')' + (ps.consent.remarks ? ' — ' + ps.consent.remarks : '')"></span>
                <span class="text-muted"><template x-for="f in ps.consent.facilities || []" :key="f.facility_id">
                  <span x-text="f.facility_id + ': ' + f.execution_status + (f.agreement_date ? ' (agreement ' + f.agreement_date + ')' : '')"></span></template></span>
              </div>
            </template>
            <template x-if="!ps?.consent">
              <div>
                <p class="status-inline" :class="current?.step?.id === 'pos_maker' ? 'status-inline-error' : ''"
                   x-text="current?.step?.id === 'pos_maker' ? 'The customer\'s sanction consent has not been recorded — the submission waits for it.' : 'The customer\'s sanction consent will be recorded by the Post-Sanction Maker.'"></p>
                <div x-show="current?.step?.id === 'pos_maker' && current?.actions?.includes('submit')">
                  <div class="los-action-row" style="flex-wrap:wrap;">
                    <label class="los-field">Acknowledged by (customer)
                      <input class="input" x-model="consent.acknowledged_by" placeholder="e.g. Director / Authorised signatory"></label>
                    <label class="los-field">Consent date<input class="input" type="date" x-model="consent.consent_date"></label>
                    <label class="los-field los-wide">Remarks<input class="input" x-model="consent.remarks" placeholder="Optional"></label>
                  </div>
                  <table class="data-table" style="max-width:760px;">
                    <thead><tr><th>Facility</th><th>Execution status</th><th>Facility agreement date</th></tr></thead>
                    <tbody><template x-for="f in consentFacilities" :key="f.facility_id">
                      <tr><td x-text="f.facility_id"></td>
                        <td><select class="input" style="width:auto;" x-model="f.execution_status">
                          <option value="">— record one —</option><option value="executed">executed</option>
                          <option value="partial">partial</option><option value="not_executed">not_executed</option></select></td>
                        <td><input class="input" type="date" style="width:auto;" x-model="f.agreement_date" :disabled="f.execution_status !== 'executed'"></td></tr>
                    </template></tbody>
                  </table>
                  <div class="los-action-row" style="margin-top:8px;">
                    <button class="btn btn-primary" :disabled="busy" @click="saveConsent()">Record sanction consent</button>
                    <span class="text-muted los-small" x-text="suggestedNote('post_sanction')"></span>
                  </div>
                </div>
              </div>
            </template>
          </div>
          <div class="tabs los-tabs">
            <button :class="{'tab-active': psTab === 'conditions'}" @click="psTab = 'conditions'">Conditions
              <span class="tab-count" x-text="(ps?.conditions || []).length"></span></button>
            <button :class="{'tab-active': psTab === 'deviations'}" @click="psTab = 'deviations'">Deviation register
              <span class="tab-count" x-text="(ps?.deviations || []).length"></span></button>
            <button :class="{'tab-active': psTab === 'compare'}" @click="psTab = 'compare'">IP → AP
              <span class="tab-count" x-show="ps?.comparison?.changes" x-text="ps?.comparison?.changes"></span></button>
            <button :class="{'tab-active': psTab === 'disburse'}" @click="psTab = 'disburse'">Disbursement</button>
          </div>

          <!-- Conditions tracker -->
          <div x-show="psTab === 'conditions'">
            <p class="text-muted" x-show="!(ps?.conditions || []).length">Conditions are recorded when the final sanction is given (Committee Sanction, AP stage).</p>
            <div class="los-src-summary" x-show="(ps?.conditions || []).length">
              <span class="badge sm" :class="ps?.condition_summary?.cp_open ? 'badge-red' : 'badge-green'" x-text="ps?.condition_summary?.cp_open + ' of ' + ps?.condition_summary?.cp_total + ' pre-commitment / pre-disbursement open'"></span>
              <span class="badge sm" x-show="ps?.condition_summary?.cps_total" :class="ps?.condition_summary?.cps_open ? 'badge-red' : 'badge-green'"
                    x-text="ps?.condition_summary?.cps_open + ' of ' + ps?.condition_summary?.cps_total + ' before subsequent disbursement open (defer them to that tranche)'"></span>
              <span class="badge sm badge-blue" x-text="ps?.condition_summary?.cs_open + ' of ' + ps?.condition_summary?.cs_total + ' CS open'"></span>
              <span class="badge sm badge-red" x-show="ps?.condition_summary?.cs_overdue" x-text="ps?.condition_summary?.cs_overdue + ' overdue'"></span>
              <span class="badge sm badge-amber" x-show="ps?.condition_summary?.pending_approval" x-text="ps?.condition_summary?.pending_approval + ' awaiting checker approval'"></span>
            </div>
            <div class="table-scroll" x-show="(ps?.conditions || []).length">
              <table class="data-table los-src-table los-cond-table">
                <thead><tr><th style="width:62px">#</th><th>Condition</th><th style="width:118px">Due</th><th style="width:96px">Status</th><th style="width:28%">Evidence / note</th><th style="width:60px" x-show="ps?.can_update_conditions"></th></tr></thead>
                <tbody><template x-for="c in ps?.conditions || []" :key="c.id">
                  <tr>
                    <td><strong x-text="c.id"></strong></td>
                    <td><span x-text="c.text"></span>
                      <span class="prov" :class="'prov-' + c.provenance" :title="c.source" x-text="provTag(c.provenance)"></span>
                      <div class="text-muted los-small" x-text="[c.category, c.stipulated_value ? 'stipulated ' + c.stipulated_value : '', c.facility_id, c.frequency && c.frequency !== 'once' ? c.frequency.replace('_', ' ') : ''].filter(Boolean).join(' · ')"></div></td>
                    <td x-text="c.due || (c.type === 'CP' ? 'Before disbursement' : '—')"></td>
                    <td><span class="badge sm" :class="condCls(c.state)" x-text="condLabel(c.state)"></span>
                      <div class="text-muted los-small" x-show="c.approval" x-text="'Approved by ' + c.approval?.by_name"></div></td>
                    <td>
                      <div x-show="condEdit !== c.id">
                        <span x-text="c.evidence || ''"></span> <span class="text-muted" x-text="c.note || ''"></span>
                        <div class="text-muted los-small" x-show="c.updated_by" x-text="c.updated_by + ' · ' + fmtDateTime(c.updated_at)"></div>
                      </div>
                      <div class="los-cond-form" x-show="condEdit === c.id">
                        <select class="input" x-model="condForm.status" aria-label="New status">
                          <option value="satisfied">Complied</option><option value="non_compliant">Not complied</option>
                          <option value="deferred">Deferred</option>
                          <option value="waived">Waived</option><option value="open">Reopen</option>
                        </select>
                        <select class="input" x-show="condForm.status === 'satisfied'" x-model="condForm.evidence" aria-label="Evidence document">
                          <option value="">Evidence document (optional)</option>
                          <template x-for="d in src?.documents || []" :key="d.document"><option :value="d.document" x-text="d.document"></option></template>
                        </select>
                        <input class="input" type="date" x-show="condForm.status === 'deferred'" x-model="condForm.due" aria-label="New due date">
                        <input class="input" x-model="condForm.note" :placeholder="condForm.status === 'satisfied' ? 'Note (or choose evidence)' : condForm.status === 'non_compliant' ? 'Reason for non-compliance and remarks (required)' : 'Reason (required)'">
                        <div class="los-action-row">
                          <button class="btn btn-sm btn-primary" :disabled="busy" @click="saveCondition(c)">Save</button>
                          <button class="btn btn-sm btn-outline" @click="condEdit = ''">Cancel</button>
                        </div>
                      </div>
                    </td>
                    <td x-show="ps?.can_update_conditions"><button type="button" class="los-link" x-show="condEdit !== c.id" @click="startCondition(c)">update</button></td>
                  </tr>
                </template></tbody>
              </table>
            </div>
            <!-- Recurring covenant monitoring (UAT-P2-11) -->
            <div class="los-panel" x-show="(ps?.covenant_summary?.covenants || []).length" style="margin-top:10px">
              <h4 style="margin-top:0">Covenant monitoring</h4>
              <div class="los-src-summary">
                <span class="badge sm" :class="(ps?.covenant_summary?.breached || []).length ? 'badge-red' : 'badge-grey'" x-text="(ps?.covenant_summary?.breached || []).length + ' breached'"></span>
                <span class="badge sm" :class="(ps?.covenant_summary?.reminders || []).length ? 'badge-amber' : 'badge-grey'" x-text="(ps?.covenant_summary?.reminders || []).length + ' reminder due'"></span>
                <span class="badge sm badge-green" x-text="(ps?.covenant_summary?.cured || []).length + ' cured'"></span>
              </div>
              <table class="data-table los-small" style="margin-top:6px">
                <thead><tr><th>Covenant</th><th>Frequency</th><th>Compliance</th><th>Next due</th><th>Last tested</th><th x-show="ps?.can_update_conditions">Monitor</th></tr></thead>
                <tbody><template x-for="cv in ps?.covenant_summary?.covenants || []" :key="cv.id">
                  <tr :class="cv.state === 'breached' ? 'los-dd-bad' : ''">
                    <td><strong x-text="cv.id"></strong> <span x-text="cv.text"></span></td>
                    <td x-text="cv.frequency"></td>
                    <td>
                      <span class="badge sm" :class="{compliant:'badge-green',untested:'badge-grey',breached:'badge-red',cured:'badge-blue',reminder_due:'badge-amber'}[cv.state] || 'badge-grey'" x-text="cv.state"></span>
                      <div class="text-muted los-small" x-show="cv.cure" x-text="'Cured ' + cv.cure?.at + ' by ' + cv.cure?.by_name + (cv.cure?.remarks ? ' — ' + cv.cure.remarks : '')"></div>
                    </td>
                    <td x-text="cv.next_due || '—'"></td>
                    <td x-text="(cv.last_tested || '—') + (cv.tests ? ' (' + cv.tests + ' test(s))' : '')"></td>
                    <td x-show="ps?.can_update_conditions">
                      <div class="los-action-row">
                        <button class="btn btn-sm btn-outline" :disabled="busy" @click="covenantTest(cv.id, 'pass')">Test: pass</button>
                        <button class="btn btn-sm btn-danger" :disabled="busy" @click="covenantTest(cv.id, 'fail')">Test: fail</button>
                        <button class="btn btn-sm btn-outline" :disabled="busy" x-show="cv.state === 'breached'" @click="covenantCure(cv.id)">Cure</button>
                      </div>
                    </td>
                  </tr>
                </template></tbody>
              </table>
            </div>
          </div>

          <!-- Deviation register -->
          <div x-show="psTab === 'deviations'">
            <p class="text-muted" x-show="!(ps?.deviations || []).length">No deviations recorded.</p>
            <div class="table-scroll" x-show="(ps?.deviations || []).length">
              <table class="data-table los-src-table">
                <thead><tr><th>#</th><th>Category</th><th>Deviation</th><th>Detail</th><th>Approving authority</th><th>Status</th></tr></thead>
                <tbody><template x-for="d in ps?.deviations || []" :key="d.id">
                  <tr><td x-text="d.id"></td><td><span class="badge sm badge-grey" x-text="d.category"></span></td>
                    <td><strong x-text="d.description"></strong></td><td class="text-muted" x-text="d.detail"></td>
                    <td x-text="d.authority || '—'"></td>
                    <td><span class="badge sm" :class="/Pending|For approval/.test(d.status) ? 'badge-amber' : 'badge-green'" x-text="d.status"></span></td></tr>
                </template></tbody>
              </table>
            </div>
          </div>

          <!-- IP → AP comparison -->
          <div x-show="psTab === 'compare'">
            <p class="text-muted" x-show="!ps?.comparison?.available" x-text="ps?.comparison?.reason"></p>
            <div x-show="ps?.comparison?.available">
              <p class="status-inline" x-show="ps?.comparison?.note" x-text="ps?.comparison?.note"></p>
              <p class="text-muted" x-show="!ps?.comparison?.final_sanctioned">The final (AP) sanction is not recorded yet — the AP column shows the current proposal.</p>
              <div class="table-scroll">
                <table class="data-table los-src-table">
                  <thead><tr><th></th><th>Item</th><th>In-principle (IP)</th><th>Application processing (AP)</th></tr></thead>
                  <tbody><template x-for="r in ps?.comparison?.rows || []" :key="r.label">
                    <tr :class="{'los-changed': r.changed}"><td class="text-muted" x-text="r.group"></td><td x-text="r.label"></td>
                      <td x-text="r.ip"></td><td><strong x-text="r.ap"></strong> <span class="badge sm badge-amber" x-show="r.changed">changed</span></td></tr>
                  </template></tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Disbursement -->
          <div x-show="psTab === 'disburse'">
            <p class="text-muted" x-show="!ps?.disbursement?.visible">Disbursement opens once post-sanction documentation is approved.</p>
            <div x-show="ps?.disbursement?.visible">
              <div class="los-rm-headline">
                <div><span>Sanctioned</span><strong x-text="fmtCr(ps?.disbursement?.sanctioned_cr)"></strong></div>
                <div><span>Approved for release</span><strong x-text="fmtCr(ps?.disbursement?.disbursed_cr)"></strong></div>
                <div><span>Available</span><strong x-text="fmtCr(ps?.disbursement?.available_cr)"></strong></div>
              </div>
              <div class="los-pack-grid">
                <div class="los-pack-block">
                  <h4>Disbursement checklist</h4>
                  <ul class="los-checklist"><template x-for="i in ps?.disbursement?.checklist || []" :key="i.id">
                    <li>
                      <label :class="{'los-auto': i.kind === 'auto'}">
                        <input type="checkbox" :checked="i.done" :disabled="i.kind === 'auto' || !ps?.disbursement?.can_edit || busy"
                               @change="toggleCheck(i, $event.target.checked)">
                        <span x-text="i.label"></span>
                      </label>
                      <span class="text-muted los-small" x-text="i.kind === 'auto' ? 'System check' : (i.done ? i.by_name + ' · ' + fmtDateTime(i.at) : '')"></span>
                    </li>
                  </template></ul>
                </div>
                <div class="los-pack-block">
                  <h4>Tranche</h4>
                  <div class="los-tranche-form" x-show="ps?.disbursement?.can_edit">
                    <label class="los-field">Amount (₹ Cr)<input class="input" type="number" min="0" step="0.01" x-model.number="trancheForm.amount_cr"></label>
                    <label class="los-field">Value date<input class="input" type="date" x-model="trancheForm.value_date"></label>
                    <label class="los-field los-wide">Purpose<input class="input" x-model="trancheForm.purpose" placeholder="e.g. first tranche — project capex"></label>
                    <button class="btn btn-sm btn-primary" :disabled="busy" @click="saveTranche()"
                            x-text="ps?.disbursement?.pending_tranche ? 'Replace pending tranche' : 'Record tranche'"></button>
                    <span class="text-muted los-small" x-text="suggestedNote('disbursement')"></span>
                  </div>
                  <table class="data-table" x-show="(ps?.disbursement?.tranches || []).length">
                    <thead><tr><th>#</th><th>Amount</th><th>Value date</th><th>Status</th></tr></thead>
                    <tbody><template x-for="t in ps?.disbursement?.tranches || []" :key="t.no">
                      <tr><td x-text="t.no"></td><td x-text="fmtCr(t.amount_cr)"></td><td x-text="t.value_date"></td>
                        <td><span class="badge sm" :class="{approved: 'badge-green', verified: 'badge-blue', requested: 'badge-amber', rejected: 'badge-red', disbursed: 'badge-green'}[t.status]" x-text="t.status === 'approved' ? 'approved for release' : t.status"></span></td></tr>
                    </template></tbody>
                  </table>
                  <p class="text-muted los-small" x-text="ps?.disbursement?.settlement_note"></p>
                  <p class="text-muted" x-show="!(ps?.disbursement?.tranches || []).length">No tranche recorded yet.</p>
                </div>
              </div>
            </div>
          </div>
        </div>
        </template>

        </div><!-- /task (part 2) -->
        <div x-show="pageTab === 'assessment'">
        <!-- Credit assessment (Risk Maker workspace): the credit-intelligence engine, read-only tabs -->
        <div class="card los-rm" x-show="rmVisible()">
          <div class="los-rm-head">
            <div>
              <span class="los-kicker">Credit assessment · credit-intelligence engine</span>
              <h3 x-text="rm?.view?.available ? 'Risk Maker workspace' : 'No credit assessment yet'"></h3>
              <span class="text-muted" x-show="rm?.view?.available && rm?.job?.state !== 'running'"
                    x-text="'Assessed ' + fmtDateTime(rm?.view?.run_at) + ' · CAM written by ' + (rm?.view?.narrative_mode === 'llm' ? 'LLM' : 'template')"></span>
              <span class="text-muted" x-show="!rm?.view?.available && rm?.job?.state !== 'running'" x-text="rm?.view?.reason"></span>
            </div>
            <div class="los-action-row">
              <button class="btn btn-primary" x-show="rm?.can_run" :disabled="rm?.job?.state === 'running'"
                      @click="runAssessment()" x-text="rm?.view?.available ? 'Re-run credit assessment' : 'Run credit assessment'"></button>
              <a class="btn btn-outline" x-show="rm?.view?.available" :href="'/#case/' + current?.entity_id + '/cam'" target="_blank" rel="noopener">Full CAM ↗</a>
            </div>
          </div>

          <div class="los-rm-job" x-show="rm?.job?.state === 'running'">
            <div class="los-progress"><div :style="'width:' + (rm?.job?.progress || 2) + '%'"></div></div>
            <span x-text="rm?.job?.message"></span>
            <!-- Agents run in parallel where their inputs allow: one chip per agent, several can be running at once. -->
            <div class="los-agent-lanes" x-show="(rm?.job?.lanes || []).length">
              <span class="text-muted" x-text="'Agents · ' + (rm?.job?.running || []).length + ' running in parallel'"></span>
              <template x-for="lane in (rm?.job?.lanes || [])" :key="lane.agent">
                <span class="badge" :class="{running: 'badge-amber', completed: 'badge-green', failed: 'badge-red'}[lane.status] || 'badge-grey'"
                      :title="lane.description" x-text="titleCase(lane.agent.replaceAll('_', ' ')) + (lane.status === 'running' ? ' …' : '')"></span>
              </template>
            </div>
          </div>
          <div class="status-inline status-inline-error" x-show="rm?.job?.state === 'failed'"><span x-text="rm?.job?.message"></span></div>

          <div x-show="rm?.view?.available && rm?.job?.state !== 'running'">
            <div class="los-rm-headline">
              <div><span>Recommendation</span><strong><span class="badge" :class="decisionCls(rm?.view?.headline?.decision)" x-text="rm?.view?.headline?.decision_label || '—'"></span></strong></div>
              <div><span>Requested → recommended</span><strong x-text="'₹' + fmtAmount(rm?.view?.headline?.requested_cr) + ' → ₹' + fmtAmount(rm?.view?.headline?.recommended_cr) + ' Cr'"></strong></div>
              <div><span>Risk grade</span><strong x-text="(rm?.view?.headline?.risk_grade || '—') + ' · ' + (rm?.view?.headline?.composite_score ?? '—')"></strong></div>
              <div><span>Repayment capacity</span><strong x-text="titleCase((rm?.view?.headline?.repayment_capacity || '').toLowerCase())"></strong></div>
              <div><span>Risks · due diligence · challenges</span><strong x-text="rm?.view?.headline?.observations + ' · ' + rm?.view?.headline?.investigations + ' · ' + rm?.view?.headline?.challenges"></strong></div>
            </div>
            <p class="los-rm-implication" x-show="rm?.view?.headline?.resilience_implication" x-text="rm?.view?.headline?.resilience_implication"></p>
            <div class="los-rm-reviewbar">
              <span class="los-kicker">Analyst review</span>
              <span x-text="reviewSummaryText()"></span>
              <span class="text-muted" x-show="!rm?.can_review">Read-only for your role.</span>
            </div>


            <div class="tabs los-rm-tabs">
              <template x-for="t in rm?.view?.tabs || []" :key="t.id">
                <button :class="{'tab-active': rmTab === t.id}" @click="rmTab = t.id; rmEdit = ''">
                  <span x-text="t.title"></span>
                  <span class="tab-count los-tab-count" x-show="t.review_counts?.fields"
                        :class="{'los-tab-count-done': t.review_counts?.reviewed === t.review_counts?.fields}"
                        x-text="t.review_counts?.reviewed + '/' + t.review_counts?.fields"></span>
                </button>
              </template>
            </div>
            <template x-for="t in (rm?.view?.tabs || []).filter(t => t.id === rmTab)" :key="t.id">
              <div class="los-rm-body">
                <div class="los-rm-tabbar" x-show="rm?.can_review && t.review_counts?.fields">
                  <button class="btn btn-sm btn-outline" :disabled="busy || t.review_counts?.reviewed === t.review_counts?.fields"
                          @click="confirmTab(t)">Confirm all in this tab</button>
                </div>
                <template x-for="(sec, si) in t.sections" :key="si">
                  <div class="los-rm-section">
                    <h4><span x-text="sec.title"></span>
                      <span class="prov" x-show="sec.provenance" :class="'prov-' + sec.provenance" :title="provLabel(sec.provenance) + (sec.source ? ' — ' + sec.source : '')" x-text="provTag(sec.provenance)"></span></h4>
                    <div class="los-rm-fields" x-show="sec.kind === 'fields'">
                      <template x-for="(f, fi) in sec.fields || []" :key="fi">
                        <div class="los-rm-field" :class="fieldCls(f)">
                          <span x-text="f.label"></span>
                          <strong><span x-text="fieldValue(f)"></span>
                            <span class="prov" :class="'prov-' + (overridden(f) ? 'ai' : f.provenance)"
                                  :title="fieldTagTitle(f)" x-text="overridden(f) ? 'Ovr' : provTag(f.provenance)"></span></strong>
                          <em class="los-rm-review" x-show="f.review" x-text="reviewLine(f)"></em>
                          <div class="los-rm-ctl" x-show="rm?.can_review && rmEdit !== f.id">
                            <button type="button" title="Confirm" :disabled="busy" @click="reviewField(f, 'confirmed')">✓</button>
                            <button type="button" title="Override" :disabled="busy" @click="startOverride(f)">✎</button>
                            <button type="button" title="Clear review" x-show="f.review" :disabled="busy" @click="reviewField(f, 'clear')">↺</button>
                          </div>
                          <div class="los-rm-edit" x-show="rmEdit === f.id">
                            <input class="input" x-model="rmEditValue" placeholder="Corrected value">
                            <input class="input" x-model="rmEditReason" placeholder="Reason (required)">
                            <div><button class="btn btn-sm btn-primary" :disabled="busy || !rmEditValue.trim() || !rmEditReason.trim()" @click="saveOverride(f)">Save override</button>
                              <button class="btn btn-sm btn-ghost" @click="rmEdit = ''">Cancel</button></div>
                          </div>
                        </div>
                      </template>
                    </div>
                    <div class="table-scroll" x-show="sec.kind === 'table' && (sec.rows || []).length">
                      <table class="data-table">
                        <thead><tr><template x-for="col in sec.columns || []" :key="col"><th x-text="col"></th></template></tr></thead>
                        <tbody><template x-for="(row, ri) in sec.rows || []" :key="ri"><tr><template x-for="(cell, ci) in row" :key="ci"><td x-text="cell ?? ''"></td></template></tr></template></tbody>
                      </table>
                    </div>
                    <p class="text-muted" x-show="sec.kind === 'table' && !(sec.rows || []).length" x-text="sec.empty"></p>
                    <ul class="los-rm-lines" x-show="sec.kind === 'text'">
                      <template x-for="(line, li) in sec.lines || []" :key="li"><li x-text="line"></li></template>
                    </ul>
                    <p class="text-muted los-note" x-show="sec.note" x-text="sec.note"></p>
                  </div>
                </template>
              </div>
            </template>
            <p class="text-muted los-note">Basis tags: hover a tag for its source. <span class="prov prov-synthetic_demo">Demo</span> values are synthetic
              (bank models not connected); <span class="prov prov-unavailable">N/A</span> means not available from submitted information.</p>
          </div>
        </div>

        </div><!-- /assessment -->
        <!-- Decision (G-W5): the computed committee, deviations (automatic + manual), decision records, remarks history -->
        <div x-show="pageTab === 'decision'">
          <div class="card" x-show="decision">
            <div class="los-rm-head"><div>
              <span class="los-kicker" x-text="decision?.stage === 'final' ? 'Final sanction' : 'In-principle sanction'"></span>
              <h3>Decision</h3>
            </div></div>
            <div class="los-panel">
              <strong>Sanctioning committee (computed)</strong>
              <div style="font-size:15px;margin:4px 0" x-text="decision?.committee?.required"></div>
              <div class="text-muted los-small"
                   x-text="'₹' + fmtAmount(decision?.committee?.amount_cr) + ' Cr · grade ' + (decision?.committee?.risk_grade || '—') + ' · ' + (decision?.committee?.deviations || 0) + ' deviation(s) · ' + (decision?.committee?.basis || '')"></div>
            </div>
            <div class="los-panel">
              <strong x-text="'Deviations (' + ((decision?.auto_deviations || []).length + (decision?.manual_deviations || []).filter(d => !d.removed).length) + ')'"></strong>
              <table class="data-table" style="margin-top:6px" x-show="(decision?.auto_deviations || []).length || (decision?.manual_deviations || []).length">
                <thead><tr><th>Deviation</th><th>Detail</th><th>Source</th><th></th></tr></thead>
                <tbody>
                  <template x-for="(d, i) in decision?.auto_deviations || []" :key="'a' + i">
                    <tr><td x-text="d.deviation"></td><td class="los-small" x-text="d.value + (d.basis ? ' — ' + d.basis : '')"></td>
                        <td><span class="badge sm badge-blue">Credit case</span></td><td></td></tr>
                  </template>
                  <template x-for="d in decision?.manual_deviations || []" :key="d.id">
                    <tr :class="{'los-term-removed': d.removed}">
                      <td><span class="los-term-text" x-text="titleCase(d.type) + ': ' + d.description"></span></td>
                      <td class="los-small" x-text="d.removed ? 'Removed: ' + d.removed_reason : 'Justification: ' + d.justification"></td>
                      <td><span class="badge sm badge-grey" x-text="'Raised by ' + d.raised_by"></span></td>
                      <td><button class="btn btn-sm btn-outline" x-show="decision?.can_add_deviation && !d.removed" @click="removeDeviation(d)">Remove</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <p class="text-muted" x-show="!(decision?.auto_deviations || []).length && !(decision?.manual_deviations || []).length">No deviations.</p>
              <div x-show="decision?.can_add_deviation" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:end">
                <label class="los-field">Type<select x-model="devForm.type">
                  <template x-for="t in decision?.deviation_types || []" :key="t"><option :value="t" x-text="titleCase(t)"></option></template></select></label>
                <label class="los-field" style="flex:1 1 240px">Deviation<input x-model="devForm.description" placeholder="e.g. Spread 25 bps below the pricing grid"></label>
                <label class="los-field" style="flex:1 1 240px">Justification<input x-model="devForm.justification" placeholder="Why it is acceptable"></label>
                <button class="btn btn-sm btn-primary" :disabled="busy || !devForm.description.trim() || !devForm.justification.trim()" @click="addDeviation()">Add deviation</button>
              </div>
            </div>
            <div class="los-panel" x-show="(decision?.notes || []).length">
              <strong>Decision notes</strong>
              <template x-for="n in decision?.notes || []" :key="n.key">
                <label class="los-field" style="display:block;margin-top:8px">
                  <span x-text="n.label"></span>
                  <span class="badge sm" style="margin-left:6px" x-show="n.status" :class="{proposed: 'badge-amber', confirmed: 'badge-green', overridden: 'badge-green'}[n.status] || 'badge-grey'"
                        x-text="{proposed: 'Agent draft — confirm or edit', confirmed: 'Confirmed', overridden: 'Edited', unavailable: 'No source — please write'}[n.status] || n.status"></span>
                  <textarea class="input" rows="2" :value="gov.notes[n.key] ?? (n.text || '')" :disabled="!decision?.can_add_deviation"
                            @input="gov.notes = {...gov.notes, [n.key]: $event.target.value}"></textarea>
                  <button class="btn btn-sm btn-outline" style="margin-top:4px" x-show="decision?.can_add_deviation" :disabled="busy"
                          @click="saveDecisionNote(n)" x-text="n.status === 'proposed' && gov.notes[n.key] === undefined ? 'Confirm' : 'Save'"></button>
                </label>
              </template>
            </div>
            <div class="los-panel" x-show="(decision?.decision_records || []).length">
              <strong>Decision records</strong>
              <table class="data-table" style="margin-top:6px">
                <thead><tr><th>Step</th><th>By</th><th>Material info date</th><th>Key matters / purpose / significant changes</th></tr></thead>
                <tbody><template x-for="(r, i) in decision?.decision_records || []" :key="i">
                  <tr><td x-text="r.step_name"></td><td x-text="r.by_name"></td><td x-text="r.material_information_date || '—'"></td>
                      <td class="los-small" x-text="[r.committee_matters, r.confirmation_ratification, r.approval_purpose, r.significant_changes, r.esms_recommendation, r.ceac_recommendation].filter(Boolean).join(' · ') || '—'"></td></tr>
                </template></tbody>
              </table>
            </div>
            <div class="los-panel">
              <strong>Remarks history</strong>
              <table class="data-table" style="margin-top:6px">
                <thead><tr><th>Date</th><th>Work step</th><th>By</th><th>Decision</th><th>Remarks</th></tr></thead>
                <tbody><template x-for="(h, i) in decision?.remarks_history || []" :key="i">
                  <tr><td class="los-small" x-text="fmtDateTime(h.at)"></td><td x-text="h.step"></td>
                      <td x-text="h.by + (h.role ? ' (' + h.role + ')' : '')"></td><td x-text="h.decision"></td>
                      <td class="los-small" x-text="h.remarks"></td></tr>
                </template></tbody>
              </table>
            </div>
          </div>
          <p class="empty-state card" x-show="!decision">Loading…</p>
        </div>
        <div x-show="pageTab === 'history'">
        <!-- Details / Activity -->
        <div class="tabs los-tabs">
          <button :class="{'tab-active': appTab === 'details'}" @click="appTab = 'details'">Application</button>
          <button :class="{'tab-active': appTab === 'activity'}" @click="appTab = 'activity'">Activity &amp; audit <span class="tab-count" x-text="current?.events?.length || 0"></span></button>
        </div>
        <div class="card los-tab-card" x-show="appTab === 'details'">
          <div class="los-kv">
            <span>Borrower</span><strong x-text="current?.borrower_name"></strong>
            <span>Entity ID</span><strong x-text="current?.entity_id"></strong>
            <span>Sector</span><strong x-text="titleCase(current?.sector)"></strong>
            <span>Constitution</span><strong x-text="titleCase(current?.constitution)"></strong>
            <span>Total proposed exposure</span><strong x-text="'₹' + fmtAmount(current?.amount_cr) + ' Cr'"></strong>
            <span>Facilities</span><strong x-text="(current?.facilities || []).length"></strong>
            <span>Related parties</span><strong x-text="(current?.related_parties || []).length"></strong>
            <span>Created</span><strong x-text="fmtDateTime(current?.created_at) + ' by ' + userName(current?.created_by)"></strong>
          </div>
          <template x-if="current?.sourcing_details">
            <div class="los-panel">
              <strong>Sourcing details</strong>
              <div class="los-dis-row">
                <label class="los-field">Prospect received<input type="date" :value="current.sourcing_details.received_date" @input="gov.src.received_date = $event.target.value" :disabled="!canEditSourcing()"></label>
                <label class="los-field">Source<select :disabled="!canEditSourcing()" @change="gov.src.source = $event.target.value">
                  <template x-for="s in current.sourcing_sources || []" :key="s"><option :selected="s === current.sourcing_details.source" x-text="s"></option></template></select></label>
                <label class="los-field">Sourcing branch<input :value="current.sourcing_details.sourcing_branch" @input="gov.src.sourcing_branch = $event.target.value" :disabled="!canEditSourcing()"></label>
                <label class="los-field">Owned by (primary)<input :value="current.sourcing_details.owner_primary" @input="gov.src.owner_primary = $event.target.value" :disabled="!canEditSourcing()"></label>
                <label class="los-field">Owned by (secondary)<input :value="current.sourcing_details.owner_secondary" @input="gov.src.owner_secondary = $event.target.value" :disabled="!canEditSourcing()"></label>
                <label class="los-field">Sol ID<input :value="current.sourcing_details.sol_id" @input="gov.src.sol_id = $event.target.value" :disabled="!canEditSourcing()"></label>
                <label class="los-field">Sub-sub-sector<input :value="current.sourcing_details.sub_sub_sector" @input="gov.src.sub_sub_sector = $event.target.value" :disabled="!canEditSourcing()"></label>
                <label class="los-field">LPFG analyst<input :value="current.sourcing_details.lpfg_analyst" @input="gov.src.lpfg_analyst = $event.target.value" :disabled="!canEditSourcing()"></label>
                <label class="los-field">LPFG senior analyst<input :value="current.sourcing_details.lpfg_senior_analyst" @input="gov.src.lpfg_senior_analyst = $event.target.value" :disabled="!canEditSourcing()"></label>
              </div>
              <button class="btn btn-sm btn-primary" style="margin-top:6px" x-show="canEditSourcing()" :disabled="busy || !Object.keys(gov.src).length" @click="saveSourcingDetails()">Save sourcing details</button>
            </div>
          </template>
          <template x-if="current?.customer_identity">
            <div>
              <h4 class="los-detail-heading">Customer identity &amp; deduplication</h4>
              <div class="los-kv">
                <span>NTB/ETB</span><strong x-text="titleCase(current.customer_identity.ntb_etb)"></strong>
                <span>Customer ID / CIF</span><strong x-text="current.customer_identity.customer_id || 'Allocated at onboarding (new-to-bank)'"></strong>
                <span>PAN</span><strong x-text="current.customer_identity.pan || '—'"></strong>
                <span>Name as per PAN</span><strong x-text="current.customer_identity.name_as_per_pan || '—'"></strong>
                <span>CIN</span><strong x-text="current.customer_identity.cin || '—'"></strong>
                <span>GSTIN</span><strong x-text="current.customer_identity.gstin || '—'"></strong>
                <span>Date of incorporation</span><strong x-text="current.customer_identity.date_of_incorporation || '—'"></strong>
                <span>Constitution</span><strong x-text="titleCase(current.customer_identity.constitution) || '—'"></strong>
                <span>CBS customer search</span><strong x-text="(current.customer_identity.cbs.status === 'found' ? 'Found' : 'Not found') + ' — ' + current.customer_identity.cbs.detail + ' (' + current.customer_identity.cbs.source + ')'"></strong>
                <span>LOS duplicate check</span><strong x-text="current.customer_identity.los_duplicates.matches.length + ' potential existing application(s)'"></strong>
              </div>
              <p class="text-muted los-small" x-text="current.customer_identity?.los_duplicates?.advice + ' (checked ' + fmtDateTime(current.customer_identity?.los_duplicates?.checked_at) + ')'"></p>
              <div class="table-scroll" x-show="current.customer_identity.los_duplicates.matches.length">
                <table class="data-table">
                  <thead><tr><th>Application</th><th>Borrower</th><th>Stage</th><th>Step</th><th>Status</th><th>Amount</th><th>Matched on</th></tr></thead>
                  <tbody><template x-for="m in current.customer_identity.los_duplicates.matches" :key="m.application_id">
                    <tr><td x-text="m.application_id"></td><td x-text="m.borrower_name + ' (' + m.entity_id + ')'"></td>
                      <td x-text="m.stage"></td><td x-text="m.step"></td>
                      <td><span class="badge sm" :class="statusCls(m.status)" x-text="statusLabel(m.status)"></span></td>
                      <td x-text="'₹' + fmtAmount(m.amount_cr) + ' Cr'"></td><td x-text="m.matched_on.join(', ')" class="text-muted"></td></tr>
                  </template></tbody>
                </table>
              </div>
            </div>
          </template>
          <template x-if="current?.sourcing_decision">
            <div>
              <h4 class="los-detail-heading">Sourcing decision</h4>
              <div class="los-kv">
                <span>Decision</span><strong x-text="current.sourcing_decision.decision || '—'"></strong>
                <span>Mandatory fields</span><strong x-text="current.sourcing_decision.mandatory_remarks || '—'"></strong>
                <span>Conditional items</span><strong x-text="current.sourcing_decision.conditional_remarks || '—'"></strong>
              </div>
            </div>
          </template>
          <template x-if="current?.due_diligence && Object.keys(current.due_diligence).length">
            <div>
              <h4 class="los-detail-heading">Due diligence (governed workspace)</h4>
              <div class="los-kv">
                <template x-for="c in (current.due_diligence.checks || []).filter(c => c.status !== 'clear')" :key="c.id">
                  <span x-text="c.name"></span>
                  <strong><span class="badge sm" :class="{ pending: 'badge-grey', matched: 'badge-red', failed: 'badge-red', unavailable: 'badge-amber' }[c.status] || 'badge-grey'" x-text="c.status"></span>
                    <span class="text-muted" x-text="c.detail || ''"></span></strong>
                </template>
                <span x-show="!(current.due_diligence.checks || []).some(c => c.status !== 'clear')">All checks</span>
                <strong class="text-muted" x-show="!(current.due_diligence.checks || []).some(c => c.status !== 'clear')">clear</strong>
              </div>
            </div>
          </template>
          <template x-if="current?.prospect_discussion && Object.values(current.prospect_discussion).some(Boolean)">
            <div>
              <h4 class="los-detail-heading">Prospect discussion</h4>
              <div class="los-kv">
                <span>Project type</span><strong x-text="current.prospect_discussion.project_type || '—'"></strong>
                <span>Funding type</span><strong x-text="current.prospect_discussion.funding_type || '—'"></strong>
                <span>Brief project description</span><strong x-text="current.prospect_discussion.brief_description || '—'"></strong>
              </div>
              <p class="text-muted" x-show="current.prospect_discussion.detailed_discussion" x-text="'Detailed discussion: ' + current.prospect_discussion.detailed_discussion"></p>
              <p class="text-muted" x-show="current.prospect_discussion.initial_remarks" x-text="'Initial sourcing remarks: ' + current.prospect_discussion.initial_remarks"></p>
            </div>
          </template>
          <h4 class="los-detail-heading">Proposed facilities</h4>          <div class="table-scroll"><table class="data-table">
            <thead><tr><th>ID</th><th>Nature</th><th>Type</th><th>Amount</th><th>Tenor</th><th>Purpose</th></tr></thead>
            <tbody><template x-for="f in current?.facilities || []" :key="f.facility_id">
              <tr><td x-text="f.facility_id"></td><td x-text="titleCase(f.facility_nature)"></td><td x-text="titleCase(f.facility_type)"></td>
                <td x-text="'₹' + fmtAmount(f.amount_cr) + ' Cr'"></td><td x-text="f.tenor_months !== null && f.tenor_months !== undefined ? f.tenor_months + ' months' : '—'"></td><td x-text="f.purpose || '—'"></td></tr>
            </template></tbody>
          </table></div>
          <h4 class="los-detail-heading">Related parties</h4>
          <p class="text-muted" x-show="!(current?.related_parties || []).length">No related parties recorded.</p>
          <div class="table-scroll" x-show="(current?.related_parties || []).length"><table class="data-table">
            <thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Type</th><th>Ownership</th><th>PAN / CIN</th><th>Verification</th></tr></thead>
            <tbody><template x-for="p in current?.related_parties || []" :key="p.party_id">
              <tr><td x-text="p.party_id"></td><td x-text="p.name"></td><td x-text="titleCase(p.role)"></td><td x-text="titleCase(p.party_type)"></td>
                <td x-text="p.ownership_pct !== null && p.ownership_pct !== undefined ? p.ownership_pct + '%' : '—'"></td><td x-text="p.pan || p.cin || '—'"></td><td><span class="badge sm badge-amber" x-text="titleCase(p.verification_status)"></span></td></tr>
            </template></tbody>
          </table></div>
          <p class="text-muted los-note">The full credit analysis (risks, due diligence, challenges, repayment, resilience and the CAM) is in the credit workspace.</p>
        </div>
        <div class="card los-tab-card" x-show="appTab === 'activity'">
          <ol class="los-timeline">
            <template x-for="e in current?.events || []" :key="e.event_id">
              <li :class="'los-ev-' + e.action">
                <div class="los-ev-head"><strong x-text="actionPast(e.action)"></strong>
                  <span x-text="e.actor_name + (e.actor_role_name ? ' · ' + e.actor_role_name : '')"></span>
                  <span class="text-muted" x-text="fmtDateTime(e.at)"></span></div>
                <div class="text-muted" x-show="e.from_step_name || e.to_step_name"
                     x-text="(e.from_step_name || '') + (e.to_step_name && e.to_step_name !== e.from_step_name ? ' → ' + e.to_step_name : '')"></div>
                <div class="los-ev-comment" x-show="e.comment" x-text="e.comment"></div>
              </li>
            </template>
          </ol>
        </div>
        </div><!-- /history -->
      </div>
    </div>
  </div>
  </template>
</section>
